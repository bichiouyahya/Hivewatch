# Single entry point for the production stack. Dashboard, API and
# WebSocket are all served from one origin behind basic auth.
#
# Create the password file before starting:
#   htpasswd -c infra/nginx/.htpasswd <username>
# (or: docker run --rm httpd:alpine htpasswd -nb user pass > infra/nginx/.htpasswd)

upstream hive_api {
    server backend:8000;
}

upstream hive_dashboard {
    server dashboard:3000;
}

server {
    listen 80;
    server_name _;

    # don't advertise the nginx version
    server_tokens off;

    # cap body size so the proxy can't be used to fill the disk
    client_max_body_size 2m;

    auth_basic "HiveWatch";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /api/ {
        proxy_pass http://hive_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://hive_api;
        # required for the websocket handshake to upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # long-lived connection, don't cut it at the default 60s
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location / {
        proxy_pass http://hive_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
