[project]
name = "hive-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "asyncssh>=2.24.0",
    "fastapi>=0.141.1",
    "geoip2>=5.3.0",
    "psycopg[binary]>=3.3.5",
    "sqlalchemy>=2.0.52",
    "stix2>=3.0.2",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
