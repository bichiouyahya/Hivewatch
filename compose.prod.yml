# Production stack:
#   - only nginx and the honeypot ports are published, so the API and
#     dashboard can't be reached directly
#   - real image builds, no bind mounts, no hot reload
#   - basic auth on nginx, containers restart on failure
#
#   docker compose -f compose.prod.yml up -d --build
#
# Set POSTGRES_PASSWORD and create infra/nginx/.htpasswd first (see README).

# own project name so prod gets its own volumes instead of sharing the
# dev stack's database
name: hivewatch-prod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env before deploying}
      POSTGRES_DB: ${POSTGRES_DB:-hive}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hive}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hive}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hive}
      SENSOR_ID: ${SENSOR_ID:-hive-prod}
      SSH_PASSWORD: ${SSH_PASSWORD:-adminpass}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-/data/GeoLite2-City.mmdb}
      # same origin as the dashboard once both are behind nginx
      DASHBOARD_ORIGIN: ${PUBLIC_URL:-http://localhost:8088}
      # not needed here since nginx handles auth and the API isn't published
      API_TOKEN: ${API_TOKEN:-}
    ports:
      # the honeypots are the part that should be reachable
      - "${SSH_HONEYPOT_PORT:-2222}:2222"
      - "${HTTP_HONEYPOT_PORT:-8080}:8080"
    volumes:
      - honeypot_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/dashboard.prod
      args:
        # baked in at build time, rebuild if the public URL changes
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost:8088}
        NEXT_PUBLIC_API_TOKEN: ${API_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - dashboard
      - backend
    ports:
      - "${PUBLIC_PORT:-8088}:80"
    volumes:
      - ./infra/nginx/hive.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    restart: unless-stopped

volumes:
  pgdata:
  honeypot_data:
